syntax = "proto3";

package deployer.build;

service BuildService {
  rpc TriggerBuild (TriggerBuildRequest) returns (TriggerBuildResponse);
  rpc GetBuildStatus (GetBuildStatusRequest) returns (GetBuildStatusResponse);
  rpc CopyArtifacts (CopyArtifactsRequest) returns (CopyArtifactsResponse);
}

message TriggerBuildRequest {
  string project_id = 1;
  string deployment_id = 2;
  string repo_url = 3;
  string branch = 4;
  map<string, string> env_vars = 5;
}

message TriggerBuildResponse {
  bool accepted = 1;
  string message = 2;
}

message GetBuildStatusRequest {
  string deployment_id = 1;
}

message GetBuildStatusResponse {
  string deployment_id = 1;
  string status = 2;
}

message CopyArtifactsRequest {
  string source_prefix = 1;
  string destination_prefix = 2;
}

message CopyArtifactsResponse {
  bool success = 1;
  string error_message = 2;
  int32 copied_count = 3;
}

